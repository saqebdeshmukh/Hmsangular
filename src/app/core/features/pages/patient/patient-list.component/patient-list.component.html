<div class="container-fluid px-4 py-4">

  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4">
    <div class="mb-3 mb-md-0">
      <h1 class="page-title mb-1">Patients</h1>
      <p class="page-subtitle mb-0">Manage all registered patients</p>
    </div>
    <a routerLink="/patients/create" class="btn btn-primary">
      <i class="fas fa-user-plus me-1"></i> Add Patient
    </a>
  </div>

  <div class="row mb-3">
    <div class="col-12 col-md-6">
      <div class="d-flex flex-column flex-sm-row gap-2">
        <input #searchInput class="form-control" placeholder="Search..." (input)="onSearch($any($event.target).value)">
        <button class="btn btn-outline-secondary" type="button"
          (click)="onSearch(''); searchInput.value = ''">Clear</button>
      </div>
    </div>
  </div>

  <div class="card card-responsive">
    <div class="card-body">
      <ag-grid-angular
        class="ag-theme-alpine"
        style="width:100%;height:600px"
        [columnDefs]="columnDefs"
        [rowData]="rowData()"
        (gridReady)="onGridReady($event)"
        (sortChanged)="onSortChanged($event)"
        (cellClicked)="onCellClicked($event)">
      </ag-grid-angular>

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3 pt-2 border-top">
        <div class="d-flex align-items-center gap-2 text-muted">
          <span>Show</span>
          <select class="form-select form-select-sm" style="width: 57px;" [value]="pageSize()" (change)="onPageSizeChange($any($event.target).value)">
            @for (size of pageSizeOptions; track size) {
              <option [value]="size">{{ size }}</option>
            }
          </select>
          <span>records</span>
        </div>

        <div class="text-muted">
          Showing {{ startRecord() }} to {{ endRecord() }} of {{ totalRecords() }} records
        </div>

        <nav aria-label="Patient pagination">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [class.disabled]="pageNumber() == 1">
              <button class="page-link" (click)="firstPage()">First</button>
            </li>
            <li class="page-item" [class.disabled]="pageNumber() == 1">
              <button class="page-link" (click)="previousPage()">Previous</button>
            </li>
            @for (page of pages(); track page) {
              <li class="page-item" [class.active]="page == pageNumber()">
                <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
              </li>
            }
            <li class="page-item" [class.disabled]="pageNumber() == totalPages()">
              <button class="page-link" (click)="nextPage()">Next</button>
            </li>
            <li class="page-item" [class.disabled]="pageNumber() == totalPages()">
              <button class="page-link" (click)="lastPage()">Last</button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <app-appointment-modal [show]="showModal()" [doctors]="doctors()" [patientDetails]="patientDetails()"
    (close)="closeModal()" (book)="handleBooking($event)">
  </app-appointment-modal>
</div>
