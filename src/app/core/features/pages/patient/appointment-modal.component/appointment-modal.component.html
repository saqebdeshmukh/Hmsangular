@if (show) {
<div class="modal-backdrop" @backdropFade (click)="onBackdropClick()">

  <div class="modal-container" @modalZoom (click)="stopPropagation($event)">

    <!-- 🔹 Header -->
    <div class="modal-header">
      <h5 class="modal-title">Book Appointment</h5>
      <button class="btn-close" (click)="onClose()"></button>
    </div>

    <!-- 🔹 Body -->
    <div class="modal-body">
      <form [formGroup]="form">

        <!-- Doctor Selection -->
        <select class="form-select mb-3" formControlName="doctorId" [disabled]="doctors.length === 1">
          <option value="">Select Doctor</option>

          @for (d of doctors; track d.id) {
          <option [value]="d.id">Dr. {{ d.firstName }} {{ d.lastName }}</option>
          }
        </select>

        <!-- Reason -->
        <input class="form-control mb-3" placeholder="Reason" formControlName="reason" />
        <div class="row">

          <div class="col-md-6 mb-2">
            <label class="form-label">Weight</label>
            <input type="text" class="form-control" placeholder="e.g. 120" formControlName="weight" />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Height</label>
            <input type="text" class="form-control" placeholder="e.g. 120" formControlName="height" />
          </div>
        </div>
        <!-- 🔹 BP & Sugar Section -->
        <div class="row">

          <div class="col-md-6 mb-2">
            <label class="form-label">Blood Pressure</label>
            <input type="text" class="form-control" placeholder="e.g. 120/80" formControlName="bloodPressure" />
          </div>

          <div class="col-md-6 mb-2">
            <label class="form-label">Sugar (Before Meal)</label>
            <input type="text" class="form-control" placeholder="e.g. 90 mg/dL" formControlName="sugarBeforeMeal" />
          </div>

          <div class="col-md-6 mb-2">
            <label class="form-label">Sugar (After Meal)</label>
            <input type="text" class="form-control" placeholder="e.g. 140 mg/dL" formControlName="sugarAfterMeal" />
          </div>
        </div>
        <div class="row mb-2">
          <div class="col-md-6">
            <label class="form-label">Appointment Date</label>
            <input type="datetime-local" formControlName="appointmentDate" [min]="minDate" class="form-control"
              placeholder="Days">
          </div>
        </div>
      </form>
    </div>
    <!-- 🔹 Footer -->
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="onClose()">Cancel</button>
      <button class="btn btn-primary" (click)="onBook()">Book</button>
    </div>

  </div>

</div>
}
