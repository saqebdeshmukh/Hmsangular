@if (show) {
  <div class="modal-backdrop" @backdropFade (click)="onBackdropClick()">

    <div class="modal-container"
         @modalZoom
         (click)="stopPropagation($event)">

      <!-- 🔹 Header -->
      <div class="modal-header">
        <h5 class="modal-title">Book Appointment</h5>
        <button class="btn-close" (click)="onClose()"></button>
      </div>

      <!-- 🔹 Body -->
      <div class="modal-body">

        <!-- Doctor Selection -->
        <select
          class="form-select mb-3"
          [disabled]="doctors.length === 1"
          (change)="selectedDoctor.set($any($event.target).value)"
        >
          <option value="">Select Doctor</option>

          @for (d of doctors; track d.id) {
            <option
              [value]="d.id"
              [selected]="selectedDoctor() === d.id"
            >
              Dr. {{ d.firstName }} {{ d.lastName }}
            </option>
          }
        </select>

        <!-- Reason -->
        <input
          class="form-control mb-3"
          placeholder="Reason"
          (input)="reason.set($any($event.target).value)"
        />
<div class="row">

          <div class="col-md-6 mb-2">
            <label class="form-label">Weight</label>
            <input
              type="text"
              class="form-control"
              placeholder="e.g. 120"
              [value]="weight()"
              (input)="weight.set($any($event.target).value)"
            />
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Height</label>
            <input
              type="text"
              class="form-control"
              placeholder="e.g. 120"
              [value]="height()"
              (input)="height.set($any($event.target).value)"
            />
          </div>
</div>
        <!-- 🔹 BP & Sugar Section -->
        <div class="row">

          <div class="col-md-6 mb-2">
            <label class="form-label">Systolic BP</label>
            <input
              type="text"
              class="form-control"
              placeholder="e.g. 120"
              [value]="systolicBp()"
              (input)="systolicBp.set($any($event.target).value)"
            />
          </div>

          <div class="col-md-6 mb-2">
            <label class="form-label">Diastolic BP</label>
            <input
              type="text"
              class="form-control"
              placeholder="e.g. 80"
              [value]="diastolicBp()"
              (input)="diastolicBp.set($any($event.target).value)"
            />
          </div>

          <div class="col-md-6 mb-2">
            <label class="form-label">Sugar (Before Meal)</label>
            <input
              type="text"
              class="form-control"
              placeholder="e.g. 90 mg/dL"
              [value]="sugarBeforeMeal()"
              (input)="sugarBeforeMeal.set($any($event.target).value)"
            />
          </div>

          <div class="col-md-6 mb-2">
            <label class="form-label">Sugar (After Meal)</label>
            <input
              type="text"
              class="form-control"
              placeholder="e.g. 140 mg/dL"
              [value]="sugarAfterMeal()"
              (input)="sugarAfterMeal.set($any($event.target).value)"
            />
          </div>

        </div>

      </div>

      <!-- 🔹 Footer -->
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="onClose()">Cancel</button>
        <button class="btn btn-primary" (click)="onBook()">Book</button>
      </div>

    </div>

  </div>
}
