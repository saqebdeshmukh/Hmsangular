<div class="container-fluid">

  <!-- HEADER -->
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-4">
    <div>
      <h2 class="text-success mb-1">Medical Records</h2>
      <p class="text-muted mb-0">View all medical records</p>
    </div>

    @if (isDoctor()) {
    <button class="btn btn-success" routerLink="/medical-records/create">
      + New Record
    </button>
    }
  </div>

  <!-- FILTERS -->
  <div class="row mb-3">
    <div class="col-12 col-lg-9 col-xl-8">
      <div class="d-flex flex-column flex-sm-row gap-2 align-items-stretch align-items-sm-center">
        <input #searchInput type="text" class="form-control flex-grow-1" placeholder="Search medical records..." (input)="onSearch($any($event.target).value)" [value]="search()">
        <input type="date" class="form-control" style="width: auto; min-width: 170px;" [value]="dateFilter" (change)="onDateFilterChange($any($event.target).value)">
        <button class="btn btn-outline-secondary" type="button" (click)="clearFilters(); searchInput.value = ''">
          Clear
        </button>
      </div>
    </div>
  </div>
  <!-- GRID -->
  <div class="card card-responsive">
    <div class="card-body p-2 p-md-4">
      <div class="table-responsive-custom">
      <ag-grid-angular class="ag-theme-alpine" style="width:100%; height:500px" [rowData]="records()"
         [columnDefs]="columnDefs"
        (gridReady)="onGridReady($event)"
        (sortChanged)="onSortChanged($event)">
      </ag-grid-angular>
      </div>

      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center flex-wrap gap-2 mt-3 pt-2 border-top">
        <div class="d-flex align-items-center gap-2 text-muted flex-wrap">
          <span>Show</span>
          <select class="form-select form-select-sm" style="width: 70px;" [value]="pageSize()" (change)="onPageSizeChange($any($event.target).value)">
            @for (size of pageSizeOptions; track size) {
              <option [value]="size">{{ size }}</option>
            }
          </select>
          <span>records</span>
        </div>

        <div class="text-muted text-sm-center order-first order-md-0">
          Showing {{ startRecord() }} to {{ endRecord() }} of {{ totalRecords() }} records
        </div>

        <nav aria-label="Medical records pagination" class="w-100 w-md-auto">
          <ul class="pagination pagination-sm mb-0 flex-wrap">
            <li class="page-item" [class.disabled]="pageNumber() == 1">
              <button class="page-link" (click)="firstPage()">First</button>
            </li>
            <li class="page-item" [class.disabled]="pageNumber() == 1">
              <button class="page-link" (click)="previousPage()">Previous</button>
            </li>
            @for (page of pages(); track page) {
              <li class="page-item" [class.active]="page == pageNumber()">
                <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
              </li>
            }
            <li class="page-item" [class.disabled]="pageNumber() == totalPages()">
              <button class="page-link" (click)="nextPage()">Next</button>
            </li>
            <li class="page-item" [class.disabled]="pageNumber() == totalPages()">
              <button class="page-link" (click)="lastPage()">Last</button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
