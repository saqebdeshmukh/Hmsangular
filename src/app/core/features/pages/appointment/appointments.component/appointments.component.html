<div class="container-fluid">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="text-success mb-0">
        <i class="bi bi-calendar-check me-2"></i>My Appointments
      </h2>
      <p class="text-muted mb-0">Manage your patient appointments</p>
    </div>

    <a routerLink="/appointments/calendar" class="btn btn-outline-primary">
      <i class="bi bi-calendar3 me-2"></i>Calendar View
    </a>
  </div>
  <div class="col-md-6">
    <div class="mb-3 d-flex flex-column flex-md-row gap-2">
      <input #searchInput type="search" class="form-control" placeholder="Search appointments" (input)="onSearch($any($event.target).value)" [value]="search()" />
      <select class="form-select" style="max-width: 220px;" (change)="onFilterChange($any($event.target).value)" [value]="statusFilter()">
        <option value="">All Appointments</option>
        <option value="Scheduled">Scheduled</option>
        <option value="Completed">Completed</option>
        <option value="Canceled">Canceled</option>
      </select>
      <button class="btn btn-outline-secondary" type="button" (click)="onSearch(''); onFilterChange(''); searchInput.value = ''">Clear</button>
    </div>
    </div>
    <div class="card">
<div class="card-body">   
      <ag-grid-angular
        class="ag-theme-alpine"
        style="width: 100%; height: 500px;"
        [columnDefs]="columnDefs"
        [rowData]="rowData()"
        (gridReady)="onGridReady($event)"
        (sortChanged)="onSortChanged($event)"
        (cellClicked)="onCellClicked($event)"
      >
      </ag-grid-angular>

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3 pt-2 border-top">
        <div class="d-flex align-items-center gap-2 text-muted">
          <span>Show</span>
          <select class="form-select form-select-sm" style="width: 57px;" [value]="pageSize()" (change)="onPageSizeChange($any($event.target).value)">
            @for (size of pageSizeOptions; track size) {
              <option [value]="size">{{ size }}</option>
            }
          </select>
          <span>records</span>
        </div>

        <div class="text-muted">
          Showing {{ startRecord() }} to {{ endRecord() }} of {{ totalRecords() }} records
        </div>

        <nav aria-label="Appointment pagination">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [class.disabled]="pageNumber() == 1">
              <button class="page-link" (click)="firstPage()">First</button>
            </li>
            <li class="page-item" [class.disabled]="pageNumber() == 1">
              <button class="page-link" (click)="previousPage()">Previous</button>
            </li>
            @for (page of pages(); track page) {
              <li class="page-item" [class.active]="page == pageNumber()">
                <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
              </li>
            }
            <li class="page-item" [class.disabled]="pageNumber() == totalPages()">
              <button class="page-link" (click)="nextPage()">Next</button>
            </li>
            <li class="page-item" [class.disabled]="pageNumber() == totalPages()">
              <button class="page-link" (click)="lastPage()">Last</button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
