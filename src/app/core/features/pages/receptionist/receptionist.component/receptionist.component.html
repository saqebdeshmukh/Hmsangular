<!-- receptionist-list.component.html -->
<div class="container-fluid px-4 py-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="page-title mb-0">Receptionists</h2>
      <p class="page-subtitle mb-0">Manage receptionist accounts</p>
    </div>

    <div>
      <a routerLink="/receptionist/create" class="btn btn-primary">
        <i class="fas fa-user-plus me-1"></i>
        New Receptionist
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
<ag-grid-angular
        class="ag-theme-alpine"
        style="width: 100%; height: 500px;"
        [rowData]="rowData()"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [paginationPageSize]="10"
      >
      </ag-grid-angular>
      

    </div>
  </div>
</div>
